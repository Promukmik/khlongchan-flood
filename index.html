<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2a31">
<title>น้ำท่วมแฟลตคลองจั่น — แจ้งเหตุและช่วยเหลือ</title>
<meta name="description" content="แผนที่สดสถานการณ์น้ำท่วมแฟลตคลองจั่น เขตบางกะปิ แจ้งเหตุ ขอความช่วยเหลือ รายงานระดับน้ำ และเบอร์ติดต่อประจำตึก">
<meta property="og:title" content="น้ำท่วมแฟลตคลองจั่น — แจ้งเหตุและช่วยเหลือ">
<meta property="og:description" content="แตะเพื่อแจ้งเหตุ ขอความช่วยเหลือ หรือรายงานระดับน้ำ ข้อมูลขึ้นแผนที่ทันทีให้กู้ภัยและทีมอาสาเห็น">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230d2a31'/%3E%3Cpath d='M3 15c2 0 2-1.5 4.5-1.5S10 15 12 15s2.5-1.5 4.5-1.5S19 15 21 15M3 19c2 0 2-1.5 4.5-1.5S10 19 12 19s2.5-1.5 4.5-1.5S19 19 21 19' fill='none' stroke='%234fc0cf' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app" data-view="map">
  <header class="top">
    <button class="brand" type="button" id="brand" title="กลับไปดูทั้งแฟลต">
      <b>น้ำท่วมคลองจั่น</b>
      <small><i></i>อัปเดตสด · แฟลตคลองจั่น เขตบางกะปิ</small>
    </button>
    <div class="seg" role="group" aria-label="มุมมอง">
      <button type="button" data-view="map" aria-pressed="true">แผนที่</button>
      <button type="button" data-view="list" aria-pressed="false" class="only-m">รายการ <span id="segCount" class="num"></span></button>
      <button type="button" id="newsBtn" aria-pressed="false">ข่าวสาร</button>
    </div>
    <div class="tright">
      <span class="clock num" id="clock">--:--</span>
      <button class="rolechip" type="button" id="roleChip">เจ้าหน้าที่</button>
    </div>
  </header>

  <div class="body">
    <aside class="side" aria-label="รายงานเหตุการณ์">
      <div class="side-h">
        <div class="row" style="justify-content:space-between"><h2>รายงานเหตุการณ์</h2><span class="muted num" id="listCount"></span></div>
        <div class="chips" id="filters"></div>
        <div id="bldFilter"></div>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <div class="mapbox" id="mapbox">
      <div id="map" role="application" aria-label="แผนที่แฟลตคลองจั่น"></div>
      <div class="sumbar" id="sumbar"></div>
      <div class="placing" id="placing" hidden><span id="placingText">แตะแผนที่เพื่อปักตำแหน่ง</span><button type="button" id="placingCancel">ยกเลิก</button></div>
      <div class="maptools">
        <button class="gpsbtn" type="button" id="gpsBtn">ตำแหน่งของฉัน</button>
        <div class="baseseg" id="baseSeg" role="group" aria-label="แบบแผนที่"><button type="button" data-base="sat" aria-pressed="true">ดาวเทียม</button><button type="button" data-base="street" aria-pressed="false">ถนน</button></div>
      </div>
      <div class="flegend" id="flegend"></div>
      <div class="banner" id="banner" hidden></div>
    </div>
  </div>

  <nav class="actions" id="actions" aria-label="เมนูแจ้งเหตุ"></nav>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
